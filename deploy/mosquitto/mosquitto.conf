# Minimal secure Mosquitto baseline for the LoRa APRS Live Map backend.
# Place at /etc/mosquitto/conf.d/aprs.conf (or merge into mosquitto.conf) on
# the Ubuntu 24.04 / Proxmox VM. None of this is applied by the build; it is
# documentation only.

listener 1883

# Anonymous access is disabled -- a password file is required.
allow_anonymous false
password_file /etc/mosquitto/passwd

# Generate the password file (first user):
#   sudo mosquitto_passwd -c /etc/mosquitto/passwd <username>
# Add additional users:
#   sudo mosquitto_passwd /etc/mosquitto/passwd <another_username>

# Recommended follow-up (not configured here, since it needs your own cert
# material): add a TLS listener, e.g.
#   listener 8883
#   cafile /etc/mosquitto/certs/ca.crt
#   certfile /etc/mosquitto/certs/server.crt
#   keyfile /etc/mosquitto/certs/server.key
